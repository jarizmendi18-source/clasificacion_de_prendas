name: CI - Clasificador de Prendas

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  test:

    name: Pruebas de código y datos

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Descargar el código
      # ==========================================

      - name: Checkout del repositorio
        uses: actions/checkout@v4


      # ==========================================
      # 2. Configurar Python
      # ==========================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # 3. Instalar dependencias
      # ==========================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install pytest


      # ==========================================
      # 4. Validar sintaxis de Python
      # ==========================================

      - name: Validar sintaxis
        run: |
          python -m py_compile app.py
          python -m py_compile drift_detection.py
          python -m py_compile drift_metrics.py


      # ==========================================
      # 5. Validar datos
      # ==========================================

      - name: Validar datos de referencia
        run: |
          python - <<'PY'
          import pandas as pd

          data = pd.read_csv("reference_data.csv")

          assert len(data) > 0, "El dataset de referencia está vacío"

          assert data.isnull().sum().sum() == 0, \
              "El dataset contiene valores nulos"

          print("Dataset de referencia válido")
          print(f"Registros: {len(data)}")
          print(f"Columnas: {list(data.columns)}")
          PY


      # ==========================================
      # 6. Validar datos actuales
      # ==========================================

      - name: Validar datos actuales
        run: |
          python - <<'PY'
          import pandas as pd

          data = pd.read_csv("current_data.csv")

          assert len(data) > 0, "El dataset actual está vacío"

          assert data.isnull().sum().sum() == 0, \
              "El dataset contiene valores nulos"

          print("Dataset actual válido")
          print(f"Registros: {len(data)}")
          print(f"Columnas: {list(data.columns)}")
          PY


      # ==========================================
      # 7. Ejecutar pruebas
      # ==========================================

      - name: Ejecutar pruebas automatizadas
        run: |
          if [ -d "tests" ]; then
            pytest tests/
          else
            echo "No existe carpeta tests."
            echo "Se continúa con las validaciones anteriores."
          fi


  # ==========================================
  # JOB 2: VALIDACIÓN DE DOCKER
  # ==========================================

  docker:

    name: Validar construcción Docker

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout del repositorio
        uses: actions/checkout@v4


      - name: Construir imagen Docker
        run: |
          docker build \
            -t clasificador-prendas:test .