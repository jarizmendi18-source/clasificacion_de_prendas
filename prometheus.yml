global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:

  - job_name: "prometheus"

    static_configs:

      - targets:
          - "host.docker.internal:9090"


  - job_name: "data-drift"

    static_configs:

      - targets:
          - "host.docker.internal:8001"